# Publish workflow for Guardian TypeScript packages
# ================================================

name: Publish NPM Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        type: boolean
        required: false
        default: false
      # The per-package inputs below must stay in sync with the package
      # lists in the "Select packages" step of the prepare job.
      guardian-client:
        description: "Publish @openzeppelin/guardian-client"
        type: boolean
        required: false
        default: false
      guardian-evm-client:
        description: "Publish @openzeppelin/guardian-evm-client"
        type: boolean
        required: false
        default: false
      guardian-operator-client:
        description: "Publish @openzeppelin/guardian-operator-client"
        type: boolean
        required: false
        default: false
      miden-multisig-client:
        description: "Publish @openzeppelin/miden-multisig-client"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Select packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GUARDIAN_CLIENT: ${{ inputs['guardian-client'] }}
          GUARDIAN_EVM_CLIENT: ${{ inputs['guardian-evm-client'] }}
          GUARDIAN_OPERATOR_CLIENT: ${{ inputs['guardian-operator-client'] }}
          MIDEN_MULTISIG_CLIENT: ${{ inputs['miden-multisig-client'] }}
        run: |
          set -euo pipefail

          # Keep the release list and the manual-run guards below in sync
          # with the workflow_dispatch package inputs.
          packages=()
          if [[ "${EVENT_NAME}" == "release" ]]; then
            packages+=(
              "guardian-client"
              "guardian-evm-client"
              "guardian-operator-client"
              "miden-multisig-client"
            )
          else
            [[ "${GUARDIAN_CLIENT}" == "true" ]] && packages+=("guardian-client")
            [[ "${GUARDIAN_EVM_CLIENT}" == "true" ]] && packages+=("guardian-evm-client")
            [[ "${GUARDIAN_OPERATOR_CLIENT}" == "true" ]] && packages+=("guardian-operator-client")
            [[ "${MIDEN_MULTISIG_CLIENT}" == "true" ]] && packages+=("miden-multisig-client")
          fi

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "::error::Select at least one package for a manual run."
            {
              echo "### Selected packages"
              echo
              echo "No packages were selected. Select at least one package and run the workflow again."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          packages_json=$(printf '%s\n' "${packages[@]}" | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')
          echo "packages=${packages_json}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Selected packages"
            echo
            printf -- '- `%s`\n' "${packages[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish selected packages
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js with npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install pinned Rust toolchain
        # Package tests spawn `cargo run` from parallel vitest workers; rustup
        # is not concurrency-safe, so install the rust-toolchain.toml pin here
        # before those concurrent invocations race to install it themselves.
        run: rustup toolchain install

      - name: Build, test, and publish
        working-directory: packages
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          DRY_RUN: ${{ inputs['dry-run'] }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail

          {
            echo "### Publish result"
            echo
            echo "| Package | Version | Result |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          summarize() {
            local package_name=$1
            local package_version=$2
            local result=$3
            echo "| \`${package_name}\` | \`${package_version}\` | ${result} |" >> "${GITHUB_STEP_SUMMARY}"
          }

          mapfile -t packages < <(jq -r '.[]' <<< "${PACKAGES}")

          abort() {
            local package_name=$1
            local package_version=$2
            local result=$3
            local next_index=$4
            summarize "${package_name}" "${package_version}" "${result}"
            local remaining
            for remaining in "${packages[@]:${next_index}}"; do
              summarize "$(jq -r '.name' "${remaining}/package.json")" "$(jq -r '.version' "${remaining}/package.json")" "⏭️ Not attempted"
            done
            exit 1
          }

          if ! npm ci; then
            abort "$(jq -r '.name' "${packages[0]}/package.json")" "$(jq -r '.version' "${packages[0]}/package.json")" "❌ Dependency installation failed" 1
          fi

          wait_for_npm() {
            local package_name=$1
            local package_version=$2
            local attempts=0
            local max_attempts=30
            while (( attempts < max_attempts )); do
              if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
                echo "${package_name}@${package_version} is visible on npm."
                return 0
              fi
              attempts=$((attempts + 1))
              echo "Waiting for ${package_name}@${package_version} on npm (${attempts}/${max_attempts})..."
              sleep 10
            done
            echo "::error::Timed out waiting for ${package_name}@${package_version} on npm"
            return 1
          }

          guardian_client_name="@openzeppelin/guardian-client"
          guardian_client_dependency=$(jq -r '.dependencies["@openzeppelin/guardian-client"]' miden-multisig-client/package.json)
          guardian_client_version=$(jq -r '.version' guardian-client/package.json)
          guardian_client_built=false

          for index in "${!packages[@]}"; do
            package="${packages[${index}]}"
            package_dir="${package}"
            workspace_name="@openzeppelin/${package}"
            package_name=$(jq -r '.name' "${package_dir}/package.json")
            package_version=$(jq -r '.version' "${package_dir}/package.json")
            next_index=$((index + 1))

            if [[ "${package}" == "miden-multisig-client" && "${guardian_client_built}" != "true" ]]; then
              # npm ci links the local workspace, but the multisig SDK imports
              # the guardian-client's generated dist output.
              if ! npm run build -w "${guardian_client_name}"; then
                abort "${package_name}" "${package_version}" "❌ Workspace dependency build failed" "${next_index}"
              fi
            fi

            if ! npm run build -w "${workspace_name}"; then
              abort "${package_name}" "${package_version}" "❌ Build failed" "${next_index}"
            fi
            if [[ "${package}" == "guardian-client" ]]; then
              guardian_client_built=true
            fi

            if ! npm test -w "${workspace_name}"; then
              abort "${package_name}" "${package_version}" "❌ Tests failed" "${next_index}"
            fi

            # A prerelease must not take the `latest` dist-tag, or `npm install`
            # with no version moves every consumer onto it. npm ignores semver
            # prerelease semantics when assigning tags, so this has to be
            # explicit. `latest` for a stable version is npm's own default, so
            # passing it always keeps the two branches identical apart from the
            # tag itself.
            if [[ "${package_version}" == *-* ]]; then
              npm_tag="rc"
            else
              npm_tag="latest"
            fi

            if [[ "${package}" == "miden-multisig-client" ]]; then
              if [[ -z "${guardian_client_dependency}" || "${guardian_client_dependency}" == "null" ]]; then
                abort "${package_name}" "${package_version}" "❌ Missing ${guardian_client_name} dependency" "${next_index}"
              fi
              # The published manifest carries a semver range, so the in-repo
              # guardian-client version must satisfy it or consumers resolve
              # a different release than the one this SDK was tested against.
              # Checked in dry runs too so a rehearsal catches it.
              if ! node -e 'process.exit(require("semver").satisfies(process.argv[1], process.argv[2]) ? 0 : 1)' "${guardian_client_version}" "${guardian_client_dependency}"; then
                abort "${package_name}" "${package_version}" "❌ ${guardian_client_name}@${guardian_client_version} does not satisfy dependency range ${guardian_client_dependency}" "${next_index}"
              fi
            fi

            if npm view "${package_name}@${package_version}" version 2>/dev/null; then
              echo "⚠️ ${package_name}@${package_version} is already published, skipping."
              summarize "${package_name}" "${package_version}" "⏭️ Already published"
            elif [[ "${DRY_RUN}" == "true" ]]; then
              if npm publish -w "${workspace_name}" --provenance --access public --tag "${npm_tag}" --dry-run; then
                summarize "${package_name}" "${package_version}" "✅ Dry run succeeded (tag: ${npm_tag})"
              else
                abort "${package_name}" "${package_version}" "❌ Dry run failed" "${next_index}"
              fi
            else
              if [[ "${package}" == "miden-multisig-client" ]]; then
                if ! wait_for_npm "${guardian_client_name}" "${guardian_client_version}"; then
                  abort "${package_name}" "${package_version}" "❌ ${guardian_client_name}@${guardian_client_version} is not on npm; publish it first or select it in the same run" "${next_index}"
                fi
              fi
              if npm publish -w "${workspace_name}" --provenance --access public --tag "${npm_tag}"; then
                summarize "${package_name}" "${package_version}" "✅ Published (tag: ${npm_tag})"
              else
                abort "${package_name}" "${package_version}" "❌ Publish failed" "${next_index}"
              fi
            fi
          done
