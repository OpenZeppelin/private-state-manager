---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental state is dead weight in CI (caches restore whole target dirs)
  # and inflates every cached target dir against the 10GB repo cache quota.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      # rust-cache prunes workspace-member artifacts before saving (they
      # recompile anyway) and dedupes the target dir, keeping per-job caches
      # within the repo's 10GB Actions cache quota. Keys automatically include
      # the job id, toolchain, and all Cargo manifests.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        if: github.event_name == 'push'
        uses: taiki-e/install-action@4a44d353abec8bd780e47de38e5bc5ea77053391 # cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@742a3ac9a75553d78e25773da9e6c438fdc5a74a # nextest

      # Coverage runs on pushes to main only: instrumentation slows test
      # execution 1.5-2x and forces workspace crates to recompile under
      # coverage flags, and was the dominant remaining cost on the PR path.
      # PRs run the same test set uninstrumented; Codecov tracks trends from
      # main. nextest schedules every binary's tests in one parallel pool
      # (cargo test parallelizes only within a binary) and prints per-test
      # timings, so slow tests are visible in the log.
      - name: Run tests (PRs, uninstrumented)
        if: github.event_name != 'push'
        run: >-
          cargo nextest run
          --workspace
          --exclude guardian-prod-benchmarks
          --exclude guardian-server-bench-loadgen
          --exclude guardian-demo
          --exclude guardian-rust-example

      - name: Run tests with coverage (main)
        if: github.event_name == 'push'
        run: >-
          cargo llvm-cov nextest
          --workspace
          --exclude guardian-prod-benchmarks
          --exclude guardian-server-bench-loadgen
          --exclude guardian-demo
          --exclude guardian-rust-example
          --lcov
          --output-path lcov.info

      # llvm-cov doctest coverage requires nightly, so doctests run as a
      # separate uninstrumented step.
      - name: Run doctests
        run: >-
          cargo test
          --workspace
          --exclude guardian-prod-benchmarks
          --exclude guardian-server-bench-loadgen
          --exclude guardian-demo
          --exclude guardian-rust-example
          --doc

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  authz-test-probe:
    name: Authz Test Probe
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Run authz test probe tests
        run: >-
          cargo test
          -p guardian-server
          --lib
          --features authz-test-probe
          api::dashboard::tests::authz_probe::

  server-feature-tests:
    name: Server Integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Run server integration tests
        run: >-
          cargo test
          -p guardian-server
          --lib
          --features integration,e2e
          testing::integration::

      - name: Run server E2E tests
        run: >-
          cargo test
          -p guardian-server
          --lib
          --features integration,e2e
          testing::e2e::

  postgres-test:
    name: Postgres Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.repository_owner == 'OpenZeppelin'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Run Postgres-backed tests
        env:
          DATABASE_URL: postgres://guardian:guardian@localhost:5432/guardian_test
        run: ./scripts/test-postgres.sh

      # Cover tests compiled only with the Postgres feature without rerunning
      # the full default-feature suite already exercised by the coverage job.
      - name: Run Postgres feature unit tests
        run: cargo test -p guardian-server --lib --features postgres -- postgres

  npm-test:
    name: TypeScript Package Tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    strategy:
      fail-fast: false
      matrix:
        package:
          - guardian-client
          - guardian-evm-client
          - guardian-operator-client
          - miden-multisig-client
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/package-lock.json

      # The procedure-roots test shells out to
      # `cargo run --example procedure_roots -p miden-multisig-client`,
      # which builds Rust workspace crates whose build scripts need protoc.
      - name: Install Rust
        if: matrix.package == 'miden-multisig-client'
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        if: matrix.package == 'miden-multisig-client'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo (rust-cache)
        if: matrix.package == 'miden-multisig-client'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Sync pinned toolchain and prebuild example fixtures
        if: matrix.package == 'miden-multisig-client'
        working-directory: .
        run: cargo build --quiet --example procedure_roots --example serialized_account -p miden-multisig-client

      - name: Install dependencies
        working-directory: packages
        run: npm ci

      - name: Assert miden SDK uses the workspace guardian-client
        if: matrix.package == 'miden-multisig-client'
        working-directory: packages
        run: |
          node <<'EOF'
          const lock = require("./package-lock.json");
          const workspaceEntry = lock.packages["node_modules/@openzeppelin/guardian-client"];
          const nestedEntry =
            lock.packages[
              "miden-multisig-client/node_modules/@openzeppelin/guardian-client"
            ];
          if (
            !workspaceEntry ||
            workspaceEntry.link !== true ||
            workspaceEntry.resolved !== "guardian-client" ||
            nestedEntry
          ) {
            console.error(
              "@openzeppelin/miden-multisig-client must resolve guardian-client from the workspace",
              { workspaceEntry, nestedEntry },
            );
            process.exit(1);
          }
          EOF

      # Workspaces link the package sources, but the multisig SDK imports the
      # guardian-client's generated dist output.
      - name: Build workspace dependencies
        if: matrix.package == 'miden-multisig-client'
        working-directory: packages
        run: npm run build -w @openzeppelin/guardian-client

      - name: Build
        working-directory: packages
        run: npm run build -w @openzeppelin/${{ matrix.package }}

      - name: Run tests
        working-directory: packages
        run: npm test -w @openzeppelin/${{ matrix.package }}

  contract-behavior:
    name: Contract Behavior Tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Run contract behavior and SDK integration tests
        run: cargo test -p miden-confidential-contracts -p miden-multisig-client --all-targets

  ts-sdk-browser:
    name: TypeScript SDK Browser Determinism
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install dependencies
        working-directory: packages
        run: npm ci

      # Workspaces link the package sources, but the multisig SDK imports the
      # guardian-client's generated dist output.
      - name: Build workspace dependencies
        working-directory: packages
        run: npm run build -w @openzeppelin/guardian-client

      - name: Build package
        working-directory: packages
        run: npm run build -w @openzeppelin/miden-multisig-client

      - name: Run browser determinism gate
        working-directory: packages
        run: npm run test:browser -w @openzeppelin/miden-multisig-client

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Build (generate protobuf descriptors)
        run: cargo build --package guardian-server

      - name: Check shared crate with production features
        run: cargo check --package guardian-shared --lib

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    # Runs on every PR (review feedback): this is the only job compiling
    # --all-features and the only release-profile (LTO) compile, so it is
    # the sole pre-merge signal for feature-unification and link-stage
    # breakage. ~5m warm, fully parallel with the other jobs.
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --release --all-features

  openapi:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenZeppelin'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@351f82a4dc29e4159746a068ed925da17341219f # 1.89.0
        with:
          toolchain: 1.98.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Check OpenAPI spec is up to date
        run: cargo run --features evm --bin gen-openapi -- --check docs
